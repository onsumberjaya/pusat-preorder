<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Input Pesanan - Benih Preorder</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div id="mobile-topbar"></div>
  <div id="sidebar-overlay"></div>
  <div class="app-shell">
    <nav id="sidebar"></nav>
    <main class="content" style="max-width:1100px;">
      <h1 class="page-title" id="page-heading">Input Pesanan Baru</h1>
      <p class="page-subtitle">Pilih produk dan gelombang, harga akan otomatis terisi.</p>

      <div id="form-container">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>

      <div id="success-box" style="display:none; max-width:650px;" class="card">
        <div class="alert alert-success" style="margin-bottom:14px;">Pesanan berhasil disimpan!</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn-primary" id="btn-cetak-nota">🖨️ Cetak Nota</button>
          <button class="btn-secondary" id="btn-input-lagi">+ Input Pesanan Lain</button>
          <a class="btn-secondary" href="pesanan.html">Lihat Daftar Pesanan</a>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/input-pesanan.js"></script>
</body>
</html>
