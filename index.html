<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk - TOKO PERTANIAN SUMBER JAYA</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { background: linear-gradient(135deg, #f0fdf4, #dcfce7); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); padding: 34px 28px; width: 100%; max-width: 380px; }
  .login-box h1 { text-align: center; font-size: 19px; color: var(--gray-900); font-weight: 800; margin: 0 0 4px; }
  .login-box p.subtitle { text-align: center; color: var(--gray-500); font-size: 13.5px; margin: 0 0 22px; }
  .hint { text-align: center; font-size: 12.5px; color: var(--gray-400); margin-top: 16px; }
</style>
</head>
<body>
  <div class="login-box">
    <div class="logo"><i class="ph-bold ph-plant"></i></div>
    <h1>TOKO PERTANIAN SUMBER JAYA</h1>
    <p class="subtitle">Silakan masuk untuk melanjutkan</p>

    <form id="login-form">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <div id="login-alert"></div>
      <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:12px;" id="login-btn">
        Masuk
      </button>
    </form>

    <p class="hint" id="setup-hint"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Kalau sudah login, langsung lempar ke daftar pesanan.
    auth.onAuthStateChanged((user) => {
      if (user) window.location.href = "pesanan.html";
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("login-btn");
      const alertBox = document.getElementById("login-alert");
      alertBox.innerHTML = "";
      btn.disabled = true;
      btn.textContent = "Memproses...";
      try {
        const cred = await auth.signInWithEmailAndPassword(usernameToEmail(username), password);
        // Fitur "1 sesi login per perangkat": catat ID sesi perangkat ini,
        // baik lokal (localStorage) maupun di profil pengguna di Firestore.
        // auth-guard.js di halaman-halaman lain akan memantau ini dan
        // menendang keluar sesi lama kalau ID-nya berbeda (login dari
        // perangkat lain menggantikan sesi yang sedang aktif).
        const sessionId = (crypto.randomUUID && crypto.randomUUID()) || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        localStorage.setItem("device_session_id", sessionId);
        await db.collection("users").doc(cred.user.uid).update({ active_session_id: sessionId });
        window.location.href = "pesanan.html";
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${friendlyFirebaseError(err)}</div>`;
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    });

    // Tampilkan hint kalau firebase-config.js belum diisi.
    if (firebaseConfig.apiKey.startsWith("GANTI_")) {
      document.getElementById("setup-hint").innerHTML =
        "⚠️ Firebase belum dikonfigurasi. Lihat PANDUAN-SETUP.md untuk langkah setup.";
    }
  </script>
</body>
</html>
