<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk - TOKO PERTANIAN SUMBER JAYA</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16a34a" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Benih Preorder" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="js/pwa-register.js"></script>
<style>
  :root {
    --soil-700: #5b3a24;
    --soil-500: #8a5a35;
    --sun-400: #f6b93b;
    --sun-500: #eba421;
  }

  body {
    background: radial-gradient(120% 100% at 15% 0%, var(--brand-100), var(--gray-50) 55%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-shell {
    display: grid;
    grid-template-columns: 1fr;
    width: 100%;
    max-width: 860px;
    background: #fff;
    border-radius: 22px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  @media (min-width: 860px) {
    .login-shell { grid-template-columns: 1fr 1fr; min-height: 560px; }
  }

  /* ---------- Panel ilustrasi: matahari terbit di atas lahan bergelombang ---------- */
  .login-visual {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #eafbf1 0%, #fdf3d4 62%, #fbe4ad 100%);
    padding: 30px 30px 0;
    min-height: 190px;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 860px) {
    .login-visual { padding: 42px 38px 0; min-height: unset; }
  }

  .login-visual .sun {
    position: absolute;
    top: 34px; right: 38px;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6da, var(--sun-400) 55%, var(--sun-500) 100%);
    box-shadow: 0 0 0 10px rgba(246, 185, 59, 0.16), 0 0 34px rgba(246, 185, 59, 0.45);
  }

  .login-visual-copy { position: relative; z-index: 2; max-width: 300px; }
  .login-visual-copy .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--brand-700); background: rgba(255,255,255,0.6);
    padding: 5px 10px; border-radius: 999px; margin-bottom: 14px;
  }
  .login-visual-copy h2 {
    font-family: "Fraunces", "Inter", serif;
    font-weight: 600;
    font-size: 24px;
    line-height: 1.25;
    color: var(--soil-700);
    margin: 0 0 8px;
  }
  .login-visual-copy p {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--gray-700);
    margin: 0;
  }

  .login-field-svg { display: block; width: 100%; height: auto; margin-top: auto; }

  .sprout { transform-origin: bottom center; animation: sprout-grow 0.7s cubic-bezier(.34,1.56,.64,1) both; }
  .sprout:nth-child(1) { animation-delay: .05s; }
  .sprout:nth-child(2) { animation-delay: .15s; }
  .sprout:nth-child(3) { animation-delay: .25s; }
  .sprout:nth-child(4) { animation-delay: .35s; }
  .sprout:nth-child(5) { animation-delay: .45s; }
  .sprout:nth-child(6) { animation-delay: .55s; }
  .sprout:nth-child(7) { animation-delay: .65s; }
  @keyframes sprout-grow {
    from { transform: scaleY(0); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sprout { animation: none; }
  }

  /* ---------- Panel form ---------- */
  .login-form-panel { padding: 36px 30px 30px; display: flex; flex-direction: column; justify-content: center; }
  @media (min-width: 860px) { .login-form-panel { padding: 42px 46px; } }

  .login-form-panel .logo {
    width: 52px; height: 52px; border-radius: 15px;
    background: linear-gradient(135deg, var(--brand-600), var(--brand-300));
    color: #fff; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(22, 163, 74, 0.28);
  }
  .login-form-panel h1 { font-size: 19px; color: var(--gray-900); font-weight: 800; margin: 0 0 4px; }
  .login-form-panel p.subtitle { color: var(--gray-500); font-size: 13.5px; margin: 0 0 24px; }
  .hint { text-align: center; font-size: 12.5px; color: var(--gray-400); margin-top: 16px; }
</style>
</head>
<body>
  <div class="login-shell">

    <div class="login-visual">
      <div class="sun" aria-hidden="true"></div>
      <div class="login-visual-copy">
        <span class="eyebrow"><i class="ph-bold ph-plant"></i> Benih &amp; Pupuk Preorder</span>
        <h2>Setiap gelombang tanam, tercatat rapi</h2>
        <p>Dari benih dipesan sampai giliran diambil pembeli.</p>
      </div>

      <!-- Lahan bergelombang dengan barisan bibit tumbuh -- mengibaratkan
           fitur "gelombang" (batch) yang jadi inti aplikasi ini. -->
      <svg class="login-field-svg" viewBox="0 0 400 150" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,90 Q66,60 133,82 T266,78 T400,64 L400,150 L0,150 Z" fill="var(--brand-200)" opacity="0.75"/>
        <path d="M0,112 Q66,88 133,106 T266,102 T400,92 L400,150 L0,150 Z" fill="var(--brand-500)" opacity="0.9"/>

        <g stroke="var(--soil-500)" stroke-width="1.4" opacity="0.35" fill="none">
          <path d="M0,124 Q66,102 133,120 T266,116 T400,106"/>
          <path d="M0,134 Q66,113 133,130 T266,126 T400,116"/>
        </g>

        <g fill="var(--brand-700)">
          <g class="sprout" transform="translate(28,110)"><path d="M0,18 Q-6,8 -1,0 Q5,8 0,18Z"/><path d="M0,18 Q6,6 2,-2 Q-4,7 0,18Z"/></g>
          <g class="sprout" transform="translate(88,100)"><path d="M0,18 Q-6,8 -1,0 Q5,8 0,18Z"/><path d="M0,18 Q6,6 2,-2 Q-4,7 0,18Z"/></g>
          <g class="sprout" transform="translate(148,114)"><path d="M0,18 Q-6,8 -1,0 Q5,8 0,18Z"/><path d="M0,18 Q6,6 2,-2 Q-4,7 0,18Z"/></g>
          <g class="sprout" transform="translate(208,96)"><path d="M0,18 Q-6,8 -1,0 Q5,8 0,18Z"/><path d="M0,18 Q6,6 2,-2 Q-4,7 0,18Z"/></g>
          <g class="sprout" transform="translate(268,110)"><path d="M0,18 Q-6,8 -1,0 Q5,8 0,18Z"/><path d="M0,18 Q6,6 2,-2 Q-4,7 0,18Z"/></g>
          <g class="sprout" transform="translate(328,92)"><path d="M0,18 Q-6,8 -1,0 Q5,8 0,18Z"/><path d="M0,18 Q6,6 2,-2 Q-4,7 0,18Z"/></g>
          <g class="sprout" transform="translate(378,102)"><path d="M0,18 Q-6,8 -1,0 Q5,8 0,18Z"/><path d="M0,18 Q6,6 2,-2 Q-4,7 0,18Z"/></g>
        </g>
      </svg>
    </div>

    <div class="login-form-panel">
      <div class="logo"><i class="ph-bold ph-plant"></i></div>
      <h1>TOKO PERTANIAN SUMBER JAYA</h1>
      <p class="subtitle">Silakan masuk untuk melanjutkan</p>

      <form id="login-form">
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <div id="login-alert"></div>
        <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:12px;" id="login-btn">
          Masuk
        </button>
      </form>

      <p class="hint" id="setup-hint"></p>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Kalau sudah login (mis. buka index.html lagi padahal sesinya masih
    // berlaku), langsung lempar ke daftar pesanan -- TAPI jangan sampai ini
    // ikut terpicu di tengah proses login yang baru saja dikirim (lihat
    // "loggingIn" di bawah), karena listener ini juga otomatis ikut nyala
    // begitu login berhasil, padahal proses catat sesi (active_session_id)
    // belum tentu selesai duluan. Kalau dibiarkan balapan, halaman bisa
    // keburu pindah sebelum active_session_id sempat tersimpan ke server --
    // efeknya orang yang baru saja login malah langsung dianggap "sesi
    // asing" oleh perangkatnya sendiri begitu sampai di halaman berikutnya.
    let loggingIn = false;
    auth.onAuthStateChanged((user) => {
      if (user && !loggingIn) window.location.href = "pesanan.html";
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("login-btn");
      const alertBox = document.getElementById("login-alert");
      alertBox.innerHTML = "";
      btn.disabled = true;
      btn.textContent = "Memproses...";
      loggingIn = true;
      try {
        const cred = await auth.signInWithEmailAndPassword(usernameToEmail(username), password);
        // Fitur "1 sesi login per perangkat": catat ID sesi perangkat ini,
        // baik lokal (localStorage) maupun di profil pengguna di Firestore.
        // auth-guard.js di halaman-halaman lain akan memantau ini dan
        // menendang keluar sesi lama kalau ID-nya berbeda (login dari
        // perangkat lain menggantikan sesi yang sedang aktif).
        const sessionId = (crypto.randomUUID && crypto.randomUUID()) || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        localStorage.setItem("device_session_id", sessionId);
        await db.collection("users").doc(cred.user.uid).update({ active_session_id: sessionId });
        window.location.href = "pesanan.html";
      } catch (err) {
        loggingIn = false;
        alertBox.innerHTML = `<div class="alert alert-error">${friendlyFirebaseError(err)}</div>`;
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    });

    // Tampilkan hint kalau firebase-config.js belum diisi.
    if (firebaseConfig.apiKey.startsWith("GANTI_")) {
      document.getElementById("setup-hint").innerHTML =
        "⚠️ Firebase belum dikonfigurasi. Lihat PANDUAN-SETUP.md untuk langkah setup.";
    }
  </script>
</body>
</html>
