<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk - TOKO PERTANIAN SUMBER JAYA</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16a34a" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Benih Preorder" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="js/pwa-register.js"></script>
<style>
  :root {
    --rice-gold: #f5b400;
    --rice-gold-light: #ffd966;
    --rice-green: #0fb85c;
  }

  body {
    background: radial-gradient(120% 100% at 15% 0%, var(--brand-100), var(--gray-50) 55%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-shell {
    display: grid;
    grid-template-columns: 1fr;
    width: 100%;
    max-width: 860px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(15, 184, 92, 0.16), 0 4px 14px rgba(15, 23, 42, 0.06);
    overflow: hidden;
  }
  @media (min-width: 860px) {
    .login-shell { grid-template-columns: 1fr 1fr; min-height: 560px; }
  }

  /* ---------- Panel ilustrasi: matahari & lahan padi menguning ---------- */
  .login-visual {
    position: relative;
    overflow: hidden;
    background: linear-gradient(165deg, var(--brand-100) 0%, var(--brand-300) 55%, #eef7c9 85%, #fdf3ae 100%);
    padding: 30px;
    min-height: 150px;
    display: flex;
    align-items: center;
  }
  @media (min-width: 860px) {
    .login-visual { padding: 42px 38px 0; min-height: unset; }
  }

  .login-visual .sun {
    position: absolute;
    top: 34px; right: 38px;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8e1, var(--rice-gold-light) 50%, var(--rice-gold) 100%);
    box-shadow: 0 0 0 10px rgba(245, 180, 0, 0.18), 0 0 34px rgba(245, 180, 0, 0.5);
  }

  .login-visual-copy { position: relative; z-index: 2; }
  .login-visual-copy .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--brand-700); background: rgba(255,255,255,0.65);
    padding: 6px 12px; border-radius: 999px;
  }

  /* ---------- Panel form ---------- */
  .login-form-panel { padding: 36px 30px 30px; display: flex; flex-direction: column; justify-content: center; }
  @media (min-width: 860px) { .login-form-panel { padding: 42px 46px; } }

  .login-form-panel .logo {
    width: 52px; height: 52px; border-radius: 15px;
    background: linear-gradient(135deg, var(--brand-600), var(--brand-300));
    color: #fff; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(22, 163, 74, 0.28);
  }
  .login-form-panel h1 { font-size: 19px; color: var(--gray-900); font-weight: 800; margin: 0 0 4px; }
  .login-form-panel p.subtitle { color: var(--gray-500); font-size: 13.5px; margin: 0 0 24px; }
  .hint { text-align: center; font-size: 12.5px; color: var(--gray-400); margin-top: 16px; }
</style>
</head>
<body>
  <div class="login-shell">

    <div class="login-visual">
      <div class="sun" aria-hidden="true"></div>
      <div class="login-visual-copy">
        <span class="eyebrow"><i class="ph-bold ph-plant"></i> Preorder Benih Padi Hibrida</span>
      </div>
    </div>

    <div class="login-form-panel">
      <div class="logo"><i class="ph-bold ph-plant"></i></div>
      <h1>TOKO PERTANIAN SUMBER JAYA</h1>
      <p class="subtitle">Silakan masuk untuk melanjutkan</p>

      <form id="login-form">
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <div id="login-alert"></div>
        <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:12px;" id="login-btn">
          Masuk
        </button>
      </form>

      <p class="hint" id="setup-hint"></p>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Kalau sudah login (mis. buka index.html lagi padahal sesinya masih
    // berlaku), langsung lempar ke daftar pesanan -- TAPI jangan sampai ini
    // ikut terpicu di tengah proses login yang baru saja dikirim (lihat
    // "loggingIn" di bawah), karena listener ini juga otomatis ikut nyala
    // begitu login berhasil, padahal proses catat sesi (active_session_id)
    // belum tentu selesai duluan. Kalau dibiarkan balapan, halaman bisa
    // keburu pindah sebelum active_session_id sempat tersimpan ke server --
    // efeknya orang yang baru saja login malah langsung dianggap "sesi
    // asing" oleh perangkatnya sendiri begitu sampai di halaman berikutnya.
    let loggingIn = false;
    auth.onAuthStateChanged((user) => {
      if (user && !loggingIn) window.location.href = "pesanan.html";
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("login-btn");
      const alertBox = document.getElementById("login-alert");
      alertBox.innerHTML = "";
      btn.disabled = true;
      btn.textContent = "Memproses...";
      loggingIn = true;
      try {
        const cred = await auth.signInWithEmailAndPassword(usernameToEmail(username), password);
        // Fitur "1 sesi login per perangkat": catat ID sesi perangkat ini,
        // baik lokal (localStorage) maupun di profil pengguna di Firestore.
        // auth-guard.js di halaman-halaman lain akan memantau ini dan
        // menendang keluar sesi lama kalau ID-nya berbeda (login dari
        // perangkat lain menggantikan sesi yang sedang aktif).
        const sessionId = (crypto.randomUUID && crypto.randomUUID()) || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        localStorage.setItem("device_session_id", sessionId);
        await db.collection("users").doc(cred.user.uid).update({ active_session_id: sessionId });
        window.location.href = "pesanan.html";
      } catch (err) {
        loggingIn = false;
        alertBox.innerHTML = `<div class="alert alert-error">${friendlyFirebaseError(err)}</div>`;
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    });

    // Tampilkan hint kalau firebase-config.js belum diisi.
    if (firebaseConfig.apiKey.startsWith("GANTI_")) {
      document.getElementById("setup-hint").innerHTML =
        "⚠️ Firebase belum dikonfigurasi. Lihat PANDUAN-SETUP.md untuk langkah setup.";
    }
  </script>
</body>
</html>
