<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profil Toko - Benih Preorder</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body data-owner-only="true">
  <div id="mobile-topbar"></div>
  <div id="sidebar-overlay"></div>
  <div class="app-shell">
    <nav id="sidebar"></nav>
    <main class="content" style="max-width:520px;">
      <h1 class="page-title">Profil Toko</h1>
      <p class="page-subtitle">Informasi ini akan tercetak di kop nota.</p>

      <div class="card">
        <form id="toko-form">
          <div class="field">
            <label>Nama Toko *</label>
            <input type="text" id="toko-nama" required disabled />
          </div>
          <div class="field">
            <label>Alamat</label>
            <textarea id="toko-alamat" rows="2" disabled></textarea>
          </div>
          <div class="field">
            <label>No. HP / Telepon</label>
            <input type="text" id="toko-nohp" disabled />
          </div>
          <div id="toko-alert"></div>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn-secondary" id="toko-edit-btn" onclick="enableTokoEdit()"><i class="ph ph-pencil-simple"></i> Edit</button>
            <button type="submit" class="btn-primary" id="toko-submit" style="display:none;">Simpan</button>
            <button type="button" class="btn-secondary" id="toko-cancel-btn" style="display:none;" onclick="cancelTokoEdit()">Batal</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/toko.js"></script>
</body>
</html>
