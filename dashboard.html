<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard - Benih Preorder</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div id="mobile-topbar"></div>
  <div id="sidebar-overlay"></div>
  <div class="app-shell">
    <nav id="sidebar"></nav>
    <main class="content">
      <h1 class="page-title">Dashboard</h1>
      <p class="page-subtitle">Ringkasan performa penjualan preorder.</p>

      <div class="card card-filter" style="margin-bottom:16px;">
        <div class="card-heading" style="margin-bottom:12px; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="card-heading-icon"><i class="ph-bold ph-funnel"></i></span>
            <h3 style="font-size:14px;">Filter Data</h3>
          </div>
          <button type="button" class="btn-secondary btn-sm mobile-only" id="dash-filter-toggle-btn" onclick="toggleDashFilterVisibility()">
            <i class="ph-bold ph-eye-slash"></i> Sembunyikan
          </button>
        </div>
        <div class="toolbar" id="dash-filter-toolbar">
          <select id="filter-periode">
            <option value="semua">Semua Waktu</option>
            <option value="harian">Hari Ini</option>
            <option value="mingguan">7 Hari Terakhir</option>
            <option value="bulanan">Bulan Ini</option>
            <option value="custom">Rentang Tanggal...</option>
          </select>
          <input type="date" id="filter-dari" style="display:none;" />
          <span id="dash-to-label" style="display:none;">s/d</span>
          <input type="date" id="filter-sampai" style="display:none;" />
          <select id="filter-gelombang-dash"><option value="">Semua Gelombang</option></select>
          <select id="filter-cabang-dash"><option value="">Semua Cabang</option></select>
        </div>
      </div>

      <div id="dashboard-content"><div class="loading-center"><div class="spinner"></div></div></div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
