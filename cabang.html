<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Cabang - Benih Preorder</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body data-owner-only="true">
  <div id="mobile-topbar"></div>
  <div id="sidebar-overlay"></div>
  <div class="app-shell">
    <nav id="sidebar"></nav>
    <main class="content">
      <h1 class="page-title">Kelola Cabang</h1>
      <p class="page-subtitle">Daftar toko cabang. Akun Karyawan cabang dikunci ke salah satu cabang di sini.</p>

      <div id="migrasi-card" class="card" style="margin-bottom:16px; display:none; background:#fffbeb; border-color:#fde68a;">
        <div class="card-heading" style="margin-bottom:8px;">
          <span class="card-heading-icon" style="background:#fef3c7; color:#b45309;"><i class="ph-bold ph-warning"></i></span>
          <h3 style="font-size:14px;">Data Lama Belum Punya Cabang</h3>
        </div>
        <p style="font-size:13px; color:var(--gray-700); margin:0 0 10px;" id="migrasi-desc"></p>
        <div class="field" style="max-width:320px;">
          <label>Pindahkan ke Cabang</label>
          <select id="migrasi-cabang-target"></select>
        </div>
        <button class="btn-secondary btn-sm" id="migrasi-btn" onclick="jalankanMigrasi()" style="margin-top:8px;">Migrasikan Sekarang</button>
      </div>

      <div style="margin-bottom:16px;">
        <button class="btn-primary" onclick="openCabangModal()">+ Cabang Baru</button>
      </div>

      <div id="cabang-list"><div class="loading-center"><div class="spinner"></div></div></div>
    </main>
  </div>

  <div class="modal-backdrop" id="cabang-modal" style="display:none;">
    <div class="modal-box">
      <h3 id="cabang-modal-title" style="margin-top:0;">Tambah Cabang</h3>
      <form id="cabang-form">
        <input type="hidden" id="cabang-id" />
        <div class="field">
          <label>Nama Cabang *</label>
          <input type="text" id="cabang-nama" required minlength="2" placeholder="Contoh: Toko Cabang Wonosari" />
        </div>
        <div class="field">
          <label>Alamat</label>
          <textarea id="cabang-alamat" rows="2"></textarea>
        </div>
        <div class="field">
          <label>No. HP / Telepon</label>
          <input type="text" id="cabang-nohp" placeholder="Contoh: 081234567890" />
        </div>
        <div id="cabang-form-alert"></div>
        <div style="display:flex; gap:10px; margin-top:18px;">
          <button type="submit" class="btn-primary" style="flex:1; justify-content:center;" id="cabang-submit-btn">Simpan</button>
          <button type="button" class="btn-secondary" onclick="closeCabangModal()">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/cabang.js"></script>
</body>
</html>
